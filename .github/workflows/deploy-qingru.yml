name: Deploy Qingru classroom
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Identify artifact
        id: meta
        run: echo "name=qingru-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare verified website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qingru-site"
          if [[ -f index.html ]]; then
            rsync -a --exclude='.git' --exclude='.github' --exclude='qingru-site.zip.part-*' ./ "$RUNNER_TEMP/qingru-site/"
          else
            cat qingru-site.zip.part-* > "$RUNNER_TEMP/qingru-site.zip"
            echo "c7789f3955879dfdf95129ba4f9cf773c2f99e1ab9c59f80244f0b736d60883a  $RUNNER_TEMP/qingru-site.zip" | sha256sum --check
            unzip -q "$RUNNER_TEMP/qingru-site.zip" -d "$RUNNER_TEMP/qingru-unpacked"
            cp -a "$RUNNER_TEMP/qingru-unpacked/清如AI/." "$RUNNER_TEMP/qingru-site/"
            if [[ -f qingru-arcstage.zip ]]; then
              echo "56b0650c86421e0121c18510fa5ba3d1da90dce397988b9599b354f80dc29737  qingru-arcstage.zip" | sha256sum --check
              unzip -oq qingru-arcstage.zip -d "$RUNNER_TEMP/qingru-site"
            fi
          fi
          echo "6ff23a799b52645f5657971d5d48bc53b32a2f633111d76ac7db59a2e9364ae5  qingru-identity.zip.b64" | sha256sum --check
          base64 --decode qingru-identity.zip.b64 > "$RUNNER_TEMP/qingru-theme-delta.zip"
          echo "25cb8304cc73d172effa57584bf58e5bdd3f0d818618865a250cdd83f504dd8c  $RUNNER_TEMP/qingru-theme-delta.zip" | sha256sum --check
          unzip -oq "$RUNNER_TEMP/qingru-theme-delta.zip" -d "$RUNNER_TEMP/qingru-site"
          test -f "$RUNNER_TEMP/qingru-site/index.html"
          test -f "$RUNNER_TEMP/qingru-site/classroom.html"
          for entry in "$RUNNER_TEMP/qingru-site/"*.html; do
            sed -i -E 's@(qingru\.css|classroom\.css|site-runtime\.js|classroom-runtime\.js|research-runtime\.js|report-reader\.css|report-reader\.mjs|assets/fonts/qingru-sans-ui\.woff2|assets/research/[a-z-]+\.png|reports/qingru-research-(report|reading)\.(pdf|docx))(\?[^" ]*)?"@\1?v=${{ github.sha }}"@g' "$entry"
          done
          for sheet in "$RUNNER_TEMP/qingru-site/qingru.css" "$RUNNER_TEMP/qingru-site/classroom.css"; do
            sed -i -E 's@(assets/fonts/qingru-sans-(ui|reading)\.woff2)(\?[^" ]*)?"@\1?v=${{ github.sha }}"@g' "$sheet"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ runner.temp }}/qingru-site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

